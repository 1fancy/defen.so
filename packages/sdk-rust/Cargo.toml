[package]
name = "defenso"
version = "0.2.0"
edition = "2021"
authors = ["Defenso <info@defen.so>"]
description = "Defenso Tower layer — fail-open security middleware for axum, warp, actix."
license = "MIT"
repository = "https://github.com/1fancy/defenso"
readme = "README.md"
keywords = ["security", "waf", "middleware", "axum", "tower"]
categories = ["web-programming::http-server"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
